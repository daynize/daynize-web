# fly.toml app configuration file generated for daynize-relay-api on 2026-10-09T22:21:59+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'daynize-relay-api'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '8080'
  PUBLIC_ORIGIN = 'https://daynize-relay-api.fly.dev'
  ALLOWED_ORIGINS = 'https://www.daynize.co.kr,https://daynize.co.kr'
  NEXT_PUBLIC_WS_URL = 'wss://daynize-relay-api.fly.dev/ws/gemini-live'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

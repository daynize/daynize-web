app = 'daynize-kecho-api'
primary_region = 'nrt'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  KECHO_CORS_ORIGINS = 'https://www.daynize.co.kr,https://daynize.co.kr'
  KECHO_DB_POOL_SIZE = '5'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpus = 1
  cpu_kind = 'shared'
<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="뿌리동사 영상과 실제 대화로 핵심 뜻과 쓰임을 익혀 보세요. DAYNIZE.">
    <title>뿌리동사 익히기 | DAYNIZE</title>
    <script>location.replace('../../index.html?category=speaking#lessons');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --paper: #f8f7f2;
            --white: #fffefa;
            --ink: #202b27;
            --muted: #59635d;
            --sage: #345d4d;
            --sage-soft: #e7eee8;
            --gold: #b68b4c;
            --line: #deded5;
            --serif: "Noto Serif KR", Georgia, serif;
            --sans: "Noto Sans KR", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background-color: var(--paper);
            background-image: repeating-linear-gradient(0deg, rgba(95, 82, 58, .018) 0, rgba(95, 82, 58, .018) 1px, transparent 1px, transparent 5px);
            font-family: var(--sans);
            font-size: 17px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid #9b7135;
            outline-offset: 3px;
        }

        .site-header {
            border-bottom: 1px solid rgba(222, 222, 213, .8);
            background: rgba(248, 247, 242, .94);
        }

        .header-inner,
        main,
        .site-footer-inner {
            width: min(1160px, calc(100% - 48px));
            margin-inline: auto;
        }

        .header-inner {
            display: flex;
            min-height: 76px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .brand-symbol {
            position: relative;
            display: block;
            width: 150px;
            height: 48px;
            flex: 0 0 auto;
            overflow: hidden;
        }

        .brand-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: auto;
            max-height: 40px;
            object-fit: contain;
            transform: translate(-50%, -50%) scale(3.5);
        }

        .brand-caption {
            color: var(--muted);
            font-size: 14px;
        }

        .back-link {
            color: var(--sage);
            font-size: 15px;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        main {
            padding: 34px 0 72px;
        }

        .breadcrumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 14px;
        }

        .breadcrumbs a:hover {
            color: var(--sage);
        }

        .crumb-separator {
            color: #9ba39c;
        }

        .course-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 30px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--sage);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        h1 {
            margin: 0;
            font-family: var(--serif);
            font-size: clamp(32px, 5vw, 46px);
            font-weight: 500;
            line-height: 1.35;
        }

        .course-intro {
            max-width: 650px;
            margin: 9px 0 0;
            color: var(--muted);
        }

        .lesson-count {
            flex: 0 0 auto;
            color: var(--sage);
            font-size: 15px;
            font-weight: 700;
        }

        .learning-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            align-items: start;
            gap: 22px;
        }

        .player-column {
            min-width: 0;
        }

        .video-shell {
            overflow: hidden;
            border: 1px solid #d8ddd6;
            border-radius: 6px;
            background: #17221e;
            box-shadow: 0 16px 40px rgba(31, 40, 34, .12);
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #17221e;
            object-fit: contain;
        }

        .now-playing {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 18px;
            padding: 21px 23px 23px;
            border: 1px solid var(--line);
            border-top: 0;
            border-radius: 0 0 6px 6px;
            background: rgba(255, 254, 250, .82);
        }

        .now-label {
            display: block;
            margin-bottom: 5px;
            color: var(--sage);
            font-size: 13px;
            font-weight: 700;
        }

        .now-playing h2 {
            margin: 0;
            font-family: var(--serif);
            font-size: 25px;
            font-weight: 600;
            line-height: 1.4;
        }

        .now-playing p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        .now-index {
            color: var(--gold);
            font-family: var(--serif);
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
        }

        .playlist {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(255, 254, 250, .78);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 19px 15px;
            border-bottom: 1px solid var(--line);
        }

        .playlist-header h2 {
            margin: 0;
            font-family: var(--serif);
            font-size: 21px;
            font-weight: 600;
        }

        .playlist-header span {
            color: var(--muted);
            font-size: 13px;
        }

        .playlist-items {
            max-height: 604px;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-color: #aab5aa #edf0eb;
            scrollbar-width: thin;
        }

        .lesson-item {
            display: grid;
            width: 100%;
            grid-template-columns: 34px minmax(0, 1fr) 24px;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border: 0;
            border-bottom: 1px solid #e9e9e2;
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: background-color .18s ease;
        }

        .lesson-item:last-child {
            border-bottom: 0;
        }

        .lesson-item:hover {
            background: #f0f3ed;
        }

        .lesson-item[aria-current="true"] {
            background: var(--sage-soft);
        }

        .lesson-number {
            color: #78847b;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .lesson-copy {
            min-width: 0;
        }

        .lesson-word {
            display: block;
            overflow: hidden;
            font-size: 16px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lesson-meaning {
            display: block;
            margin-top: 1px;
            color: var(--muted);
            font-size: 13px;
        }

        .lesson-play {
            color: var(--sage);
            font-size: 17px;
            text-align: center;
        }

        .player-status {
            min-height: 26px;
            margin: 9px 2px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .site-footer {
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
        }

        .site-footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 0 28px;
        }

        @media (max-width: 820px) {
            .learning-layout {
                grid-template-columns: minmax(0, 1fr) 290px;
                gap: 15px;
            }

            .header-inner,
            main,
            .site-footer-inner {
                width: min(100% - 32px, 680px);
            }

            .lesson-item {
                padding-inline: 12px;
            }
        }

        @media (max-width: 680px) {
            .header-inner {
                min-height: 68px;
            }

            .brand-symbol {
                width: 124px;
            }

            .brand-mark {
                transform: translate(-50%, -50%) scale(3);
            }

            .brand-caption {
                display: none;
            }

            .back-link {
                font-size: 14px;
            }

            main {
                padding-top: 23px;
            }

            .breadcrumbs {
                margin-bottom: 23px;
            }

            .course-heading {
                align-items: start;
                flex-direction: column;
                gap: 9px;
                margin-bottom: 20px;
            }

            .course-intro {
                font-size: 16px;
            }

            .learning-layout {
                grid-template-columns: minmax(0, 1fr);
                gap: 17px;
            }

            .now-playing {
                padding: 16px;
            }

            .now-playing h2 {
                font-size: 22px;
            }

            .playlist-items {
                max-height: 390px;
            }

            .site-footer-inner {
                flex-direction: column;
                gap: 3px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="../../exit-quiz.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="../../index.html" aria-label="DAYNIZE 홈페이지">
                <span class="brand-symbol"><img class="brand-mark" src="../../DAYNIZE%20LOGO%20ONLY.png"
                        alt="DAYNIZE"></span>
                <span class="brand-caption">지난 주 영어</span>
            </a>
            <a class="back-link" href="../../index.html#lessons">강의 목록으로 <span aria-hidden="true">↗</span></a>
        </div>
    </header>

    <main>
        <nav class="breadcrumbs" aria-label="현재 위치">
            <a href="../../index.html">홈</a><span class="crumb-separator" aria-hidden="true">/</span>
            <a href="../../index.html#lessons">이번 주 수업</a><span class="crumb-separator" aria-hidden="true">/</span>
            <span aria-current="page">영어 말하는 법</span>
        </nav>

        <section aria-labelledby="course-title">
            <div class="course-heading">
                <div>
                    <p class="eyebrow">SPEAKING PRACTICE</p>
                    <h1 id="course-title">영어 말하는 법</h1>
                    <p class="course-intro">동사의 쓰임을 짧은 영상으로 익히고, 한 문장씩 소리 내어 연습해 보세요.</p>
                </div>
                <span class="lesson-count">영상 강의 18편</span>
            </div>

            <div class="learning-layout">
                <div class="player-column">
                    <div class="video-shell">
                        <video id="lesson-video" controls playsinline preload="metadata" aria-label="영어 말하기 강의 영상">
                            이 브라우저에서는 동영상을 재생할 수 없습니다.
                        </video>
                    </div>
                    <div class="now-playing" aria-live="polite">
                        <div>
                            <span class="now-label">지금 재생 중</span>
                            <h2 id="current-title">I care</h2>
                            <p id="current-meaning">돌보다 · 신경 쓰다</p>
                        </div>
                        <span class="now-index" id="current-index">01 / 18</span>
                    </div>
                    <p class="player-status" id="player-status" role="status" aria-live="polite">목록에서 강의를 선택하면 영상이
                        재생됩니다.</p>
                </div>

                <aside class="playlist" aria-labelledby="playlist-title">
                    <div class="playlist-header">
                        <h2 id="playlist-title">강의 목록</h2>
                        <span>18개 영상</span>
                    </div>
                    <div class="playlist-items" id="playlist-items" aria-label="영어 말하기 영상 목록"></div>
                </aside>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>DAYNIZE · 지난 주 영어</span>
            <a href="../../index.html">홈페이지로 돌아가기</a>
        </div>
    </footer>

    <script src="../../exit-quiz.js"></script>
    <script>
        (() => {
            const lessons = [
                ['care', '돌보다 · 신경 쓰다'],
                ['bring', '가져오다 · 데려오다'],
                ['catch', '잡다 · 알아듣다'],
                ['check', '확인하다 · 살펴보다'],
                ['clear', '치우다 · 분명히 하다'],
                ['come', '오다 · 도착하다'],
                ['get', '얻다 · 도착하다'],
                ['give', '주다 · 건네다'],
                ['go', '가다 · 진행하다'],
                ['hold', '잡다 · 유지하다'],
                ['look', '보다 · 살펴보다'],
                ['make', '만들다 · 하게 하다'],
                ['pick', '고르다 · 집어 들다'],
                ['put', '놓다 · 두다'],
                ['run', '달리다 · 운영하다'],
                ['set', '놓다 · 설정하다'],
                ['take', '가져가다 · 데려가다'],
                ['turn', '돌다 · 바꾸다']
            ].map(([word, meaning]) => ({ word, meaning, src: `../../VIDEOS/verbs/${word}.mp4` }));

            const video = document.querySelector('#lesson-video');
            const playlist = document.querySelector('#playlist-items');
            const title = document.querySelector('#current-title');
            const meaning = document.querySelector('#current-meaning');
            const indexLabel = document.querySelector('#current-index');
            const status = document.querySelector('#player-status');
            let selectedIndex = 0;
            const quiz = ExitQuiz.init({
                getItems: () => lessons.map((l) => ({ id: l.word, title: `I ${l.word} — ${l.meaning.split('·')[0].trim()}`, keyPhrase: `I ${l.word}`, explanation: l.meaning })),
                triggerSelector: '.brand, .back-link, .breadcrumbs a, .site-footer a',
                storageKey: 'exitQuizUsedSpeaking',
                onRewatch: (item) => {
                    selectLesson(lessons.findIndex((l) => l.word === item.id), true);
                    video.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
            video.addEventListener('play', () => quiz.markWatched(lessons[selectedIndex].word));

            const selectLesson = (index, shouldPlay = false) => {
                selectedIndex = (index + lessons.length) % lessons.length;
                const lesson = lessons[selectedIndex];
                if (shouldPlay) quiz.markWatched(lesson.word);
                video.src = lesson.src.replace('VIDEOS/videos/', 'VIDEOS/verbs/');
                video.load();
                title.textContent = `I ${lesson.word}`;
                meaning.textContent = lesson.meaning;
                indexLabel.textContent = `${String(selectedIndex + 1).padStart(2, '0')} / ${lessons.length}`;
                playlist.querySelectorAll('.lesson-item').forEach((item, itemIndex) => {
                    if (itemIndex === selectedIndex) item.setAttribute('aria-current', 'true');
                    else item.removeAttribute('aria-current');
                });
                status.textContent = shouldPlay ? '영상을 불러오고 있습니다.' : '목록에서 강의를 선택하면 영상이 재생됩니다.';
                if (shouldPlay) video.play().catch(() => {
                    status.textContent = '재생 버튼을 눌러 영상을 시작해 주세요.';
                });
            };

            lessons.forEach((lesson, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'lesson-item';
                button.setAttribute('aria-label', `${index + 1}강, I ${lesson.word}, ${lesson.meaning}`);
                button.innerHTML = `<span class="lesson-number">${String(index + 1).padStart(2, '0')}</span><span class="lesson-copy"><span class="lesson-word">I ${lesson.word}</span><span class="lesson-meaning">${lesson.meaning}</span></span><span class="lesson-play" aria-hidden="true">▶</span>`;
                button.addEventListener('click', () => selectLesson(index, true));
                playlist.append(button);
            });

            video.addEventListener('ended', () => selectLesson(selectedIndex + 1, true));
            video.addEventListener('error', () => {
                status.textContent = '영상을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
            });
            selectLesson(selectedIndex);
        })();
    </script>
</body>

</html>

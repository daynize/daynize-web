name: Deploy K-ECHO API

on:
  push:
    branches:
      - main
    paths:
      - K-ECHO/kecho-backend/**
      - .github/workflows/kecho-api.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy K-ECHO API
    runs-on: ubuntu-latest
    concurrency: kecho-api-deploy
    defaults:
      run:
        working-directory: K-ECHO/kecho-backend
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when FLY_API_TOKEN is not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        working-directory: .
        run: echo "::notice::FLY_API_TOKEN secret is not set, so the K-ECHO Fly deploy was skipped."
      - uses: actions/checkout@v4
        if: ${{ env.FLY_API_TOKEN != '' }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      - run: flyctl deploy --remote-only
        if: ${{ env.FLY_API_TOKEN != '' }}